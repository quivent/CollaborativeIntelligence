[package]
name = "collaborative-intelligence-core"
version = "0.1.0"
edition = "2021"
description = "Core functionality for Collaborative Intelligence system"

[[bin]]
name = "matrix_cli"
path = "matrix_cli.rs"

[[bin]]
name = "app_demo"
path = "app_demo.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
clap = { version = "4.0", features = ["derive"] }

[lib]
name = "collaborative_intelligence_core"
path = "lib.rs"