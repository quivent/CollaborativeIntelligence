[package]
name = "agent_cache"
version = "0.1.0"
edition = "2021"
authors = ["Athena <athena@collaborative-intelligence.org>"]
description = "Agent Cache System for the Collaborative Intelligence framework"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"
clap = { version = "4.3", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
colored = "2.0"

[lib]
name = "agent_cache"
path = "src/lib.rs"

[[bin]]
name = "agent-cache"
path = "src/main.rs"