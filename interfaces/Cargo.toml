[workspace]
members = [
    "agent-cache",
    "db", 
    "memory"
]

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
chrono = "0.4"
dirs = "5.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Josh Kornreich", "CollaborativeIntelligence Team"]