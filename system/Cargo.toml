[package]
name = "instruction-cache-system"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-cache"
path = "main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
flate2 = "1.0"
regex = "1.5"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "instruction_cache_system"
path = "mod.rs"