[package]
name = "collaborative_intelligence"
version = "0.1.0"
edition = "2021"
authors = ["Josh Kornreich"]
description = "Memory management system for Collaborative Intelligence"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.5"
lazy_static = "1.4"
rayon = "1.5"
md5 = "0.7"
tokio = { version = "1.15", features = ["full"] }
futures = "0.3"
thiserror = "1.0"
dashmap = "5.1"
log = "0.4"
env_logger = "0.9"
sha2 = "0.10"
notify = "6.0"
walkdir = "2.3"
anyhow = "1.0"
parking_lot = "0.12"
tantivy = "0.19"
rand = "0.8"
async-trait = "0.1"
crossbeam = "0.8"
directories = "4.0"
glob = "0.3"
tracing = "0.1"
flate2 = "1.0"
tempfile = "3.3"
bzip2 = "0.4"
zstd = "0.11"
clap = { version = "3.2", features = ["derive"] }

[lib]
name = "memory_system"
path = "src/lib.rs"

[[bin]]
name = "agent_cache_system"
path = "agent_cache_system.rs"

[[bin]]
name = "memory_segment_parser"
path = "memory_segment_parser.rs"

[[bin]]
name = "memory_activation_model"
path = "memory_activation_model.rs"

[[bin]]
name = "memory_loader"
path = "memory_loader.rs"

[[bin]]
name = "memory_updater"
path = "memory_updater.rs"

[[bin]]
name = "memory_checksum_cache"
path = "memory_checksum_cache.rs"

[[bin]]
name = "agent_activator"
path = "agent_activator.rs"

[[bin]]
name = "memory_consolidator" 
path = "memory_consolidator.rs"

[[bin]]
name = "global_context_cache"
path = "global_context_cache.rs"

[[bin]]
name = "memory_preloader"
path = "memory_preloader.rs"

[[bin]]
name = "memory_recovery"
path = "memory_recovery.rs"

[[bin]]
name = "memory_compression"
path = "memory_compression.rs"

[[bin]]
name = "memory_streamer"
path = "memory_streamer.rs"

[[bin]]
name = "memory_indexes"
path = "memory_indexes.rs"

[[bin]]
name = "memory_migrator"
path = "memory_migrator.rs"

[[bin]]
name = "memory_cli"
path = "memory_cli.rs"

[[bin]]
name = "memory_bridge"
path = "memory_bridge.rs"

[[bin]]
name = "memory_integration"
path = "memory_integration.rs"

[[bin]]
name = "memory_cache"
path = "memory_cache.rs"

[[bin]]
name = "unified_memory_cli"
path = "unified_memory_cli.rs"

[[bin]]
name = "migration_plan"
path = "migration_plan.rs"

[[bin]]
name = "remove_cir_references"
path = "remove_cir_references.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1