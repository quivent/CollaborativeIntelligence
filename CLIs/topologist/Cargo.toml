[package]
name = "topologist"
version = "0.1.0"
edition = "2021"
description = "Portable repository topology analysis and commit planning system"
license = "MIT"
authors = ["Topological Repository Management System"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }

[lib]
name = "topologist"
path = "src/lib.rs"

[[bin]]
name = "ci-topologist"
path = "src/main.rs"