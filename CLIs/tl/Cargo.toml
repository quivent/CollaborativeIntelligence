[package]
name = "tl-cli"
version = "0.1.0"
edition = "2021"
description = "Teaching/Learning CLI for CollaborativeIntelligence repository maintenance"
authors = ["Collaborative Intelligence Team"]

[[bin]]
name = "tl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
regex = "1.8"
chrono = "0.4"
tempfile = "3.5"
colored = "2.0"
indicatif = "0.17"