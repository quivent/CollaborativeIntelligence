[package]
name = "ci"
version = "0.1.0"
edition = "2021"
description = "Collaborative Intelligence CLI"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
colored = "2.0"
tempfile = "3.8"
dirs = "5.0"
regex = "1.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"