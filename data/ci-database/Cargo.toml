[package]
name = "ci_database"
version = "0.1.0"
edition = "2021"
authors = ["CollaborativeIntelligence Team"]
description = "Database management system for Collaborative Intelligence"

[dependencies]
# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "json", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "2.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
colored = "2.0"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"

[[bin]]
name = "ci-db"
path = "src/bin/cli.rs"

[lib]
name = "ci_database"
path = "src/lib.rs"