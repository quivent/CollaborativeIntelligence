[package]
name = "db-cli"
version = "0.1.0"
edition = "2021"
authors = ["CollaborativeIntelligence Team"]
description = "Database CLI for CollaborativeIntelligence system"

[[bin]]
name = "db"
path = "src/main.rs"

[dependencies]
# Database library - temporarily disable until fixed
# ci_database = { path = "../ci-database" }

# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }
clap-verbosity-flag = "2.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Utilities
colored = "2.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"

# Table formatting
prettytable-rs = "0.10"

# YAML support
serde_yaml = "0.9"

# Directory walking
walkdir = "2.5"

# SQLite
rusqlite = { version = "0.30", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.12"