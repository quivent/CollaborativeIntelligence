<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        /* Base Styles */
        :root {
            --primary-color: #3a86ff;
            --secondary-color: #8338ec;
            --accent-color: #ff006e;
            --text-color: #2b2d42;
            --text-light: #8d99ae;
            --background-color: #ffffff;
            --background-secondary: #f8f9fa;
            --code-background: #f5f7ff;
            --border-color: #edf2f7;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --font-heading: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-code: 'Fira Code', 'Roboto Mono', monospace;
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #4d9fff;
                --secondary-color: #9d63ff;
                --accent-color: #ff3385;
                --text-color: #e5e7eb;
                --text-light: #9ca3af;
                --background-color: #1f2937;
                --background-secondary: #111827;
                --code-background: #282c34;
                --border-color: #374151;
                --shadow-color: rgba(0, 0, 0, 0.2);
            }
        }

        /* Typography */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Fira+Code:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-color);
            background-color: var(--background-color);
            max-width: 100%;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /* Layout */
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        main {
            min-height: 70vh;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 4rem;
            font-size: 0.9rem;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
        }

        /* Headings */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            margin: 2rem 0 1rem;
            line-height: 1.3;
            font-weight: 600;
            color: var(--text-color);
        }

        h1 {
            font-size: 2.5rem;
            margin-top: 0;
            text-align: center;
            font-weight: 700;
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        h3 {
            font-size: 1.5rem;
        }

        h4 {
            font-size: 1.25rem;
        }

        h5 {
            font-size: 1.1rem;
        }

        h6 {
            font-size: 1rem;
        }

        /* Text elements */
        p {
            margin-bottom: 1.5rem;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        a:hover {
            border-bottom-color: var(--primary-color);
        }

        strong {
            font-weight: 600;
        }

        em {
            font-style: italic;
        }

        blockquote {
            border-left: 4px solid var(--primary-color);
            padding: 0.5rem 0 0.5rem 1.5rem;
            margin: 1.5rem 0;
            color: var(--text-light);
            font-style: italic;
            background-color: var(--background-secondary);
            border-radius: 0 4px 4px 0;
        }

        blockquote p {
            margin-bottom: 0;
        }

        /* Lists */
        ul, ol {
            margin: 1rem 0 1.5rem 2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* Code blocks */
        pre {
            background-color: var(--code-background);
            border-radius: 4px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border-color);
        }

        code {
            font-family: var(--font-code);
            font-size: 0.9rem;
            background-color: var(--code-background);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
            font-size: 0.95rem;
            display: block;
            line-height: 1.5;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            overflow-x: auto;
            display: block;
        }

        table thead {
            background-color: var(--background-secondary);
        }

        table th,
        table td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        table th {
            font-weight: 600;
        }

        table tr:nth-child(even) {
            background-color: var(--background-secondary);
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1.5rem 0;
            box-shadow: 0 4px 6px var(--shadow-color);
            display: block;
        }

        /* Horizontal rule */
        hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 2rem 0;
        }

        /* Navigation */
        .page-nav {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .page-nav a {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: var(--background-secondary);
            border-radius: 4px;
            border-bottom: none;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .page-nav a:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Utility classes */
        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-left {
            text-align: left;
        }

        .caption {
            font-size: 0.9rem;
            color: var(--text-light);
            text-align: center;
            margin-top: -1rem;
            margin-bottom: 1.5rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                font-size: 15px;
            }
            h1 {
                font-size: 2rem;
            }
            h2 {
                font-size: 1.6rem;
            }
            h3 {
                font-size: 1.4rem;
            }
            .container {
                padding: 1rem;
            }
        }
        
        /* Custom theme overrides */
        {{CUSTOM_STYLES}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{{TITLE}}</h1>
            <div class="page-nav">
                {{NAVIGATION}}
            </div>
        </header>
        
        <main>
            {{CONTENT}}
        </main>
        
        <footer>
            <p>Generated by <strong>Designer Agent</strong> | {{TIMESTAMP}}</p>
        </footer>
    </div>
</body>
</html>
