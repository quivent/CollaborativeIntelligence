name: DB CLI CI

on:
  push:
    paths:
      - 'data/db-cli/**'
      - 'data/ci-database/**'
  pull_request:
    paths:
      - 'data/db-cli/**'
      - 'data/ci-database/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test DB CLI
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build CI Database
      working-directory: data/ci-database
      run: cargo build --release
    
    - name: Build DB CLI
      working-directory: data/db-cli
      run: cargo build --release
    
    - name: Run tests
      working-directory: data/db-cli
      run: cargo test
    
    - name: Run integration tests
      working-directory: data/db-cli
      run: cargo test --test '*' -- --test-threads=1
    
    - name: Check formatting
      working-directory: data/db-cli
      run: cargo fmt -- --check
    
    - name: Run clippy
      working-directory: data/db-cli
      run: cargo clippy -- -D warnings

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true
    
    - name: Build release
      working-directory: data/db-cli
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Create archive
      run: |
        cd data/db-cli/target/${{ matrix.target }}/release
        tar czf db-${{ matrix.target }}.tar.gz db
        mv db-${{ matrix.target }}.tar.gz $GITHUB_WORKSPACE/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: db-${{ matrix.target }}
        path: db-${{ matrix.target }}.tar.gz

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        path: ./artifacts
    
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/**/*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}