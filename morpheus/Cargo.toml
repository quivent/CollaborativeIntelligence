[package]
name = "morpheus"
version = "0.1.0"
edition = "2021"
description = "Morpheus CLI - Shadow of the Guide"
license = "MIT"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
instruction-cache-system = { path = "../system" }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
async-trait = "0.1"
dashmap = "5.0"
md5 = "0.7"
